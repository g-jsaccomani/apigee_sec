apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-backend
  labels:
    app: vulnerable-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-backend
  template:
    metadata:
      labels:
        app: vulnerable-backend
    spec:
      containers:
      - name: vulnerable-backend
        image: ${IMAGE_NAME}
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-backend-service
spec:
  type: LoadBalancer
  selector:
    app: vulnerable-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
